<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 300px; padding: 12px; margin: 0; font-size: 14px; }
      h1 { font-size: 16px; margin: 0 0 10px; }
      label { display: block; margin-top: 8px; font-weight: 600; font-size: 12px; color: #333; }
      input, textarea { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 3px; font-size: 13px; font-family: inherit; }
      textarea { resize: vertical; min-height: 56px; }
      .row { display: flex; gap: 8px; }
      .row > div { flex: 1; }
      button { width: 100%; padding: 8px; margin-top: 12px; font-size: 14px; cursor: pointer; }
      #result { display: none; margin-top: 12px; }
      #link { word-break: break-all; font-size: 12px; color: #444; }
      #status { margin-top: 8px; font-size: 12px; color: #555; min-height: 1em; }
    </style>
  </head>
  <body>
    <h1>Create add-to-calendar link</h1>

    <form id="event-form">
      <label>Event title
        <input id="title" required />
      </label>
      <div class="row">
        <div>
          <label>Start date
            <input id="start-date" type="date" required />
          </label>
        </div>
        <div>
          <label>Start time
            <input id="start-time" type="time" required />
          </label>
        </div>
      </div>
      <div class="row">
        <div>
          <label>End date
            <input id="end-date" type="date" required />
          </label>
        </div>
        <div>
          <label>End time
            <input id="end-time" type="time" required />
          </label>
        </div>
      </div>
      <label>Location
        <input id="location" />
      </label>
      <label>Description
        <textarea id="description"></textarea>
      </label>
      <button type="submit" id="submit">Create link</button>
    </form>

    <div id="result">
      <a id="link" target="_blank" rel="noopener"></a>
      <button type="button" id="copy">Copy link</button>
    </div>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
